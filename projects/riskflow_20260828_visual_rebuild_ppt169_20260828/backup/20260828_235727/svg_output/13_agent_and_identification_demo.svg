    <rect x="656" y="492" width="568" height="130" rx="10" fill="#EEF7F4"/>
    <text x="680" y="522" font-size="17" font-weight="700" fill="#2F8F7A">智能识别中心</text>
    <text x="680" y="556" font-size="15" fill="#1C2733">· 过程：按工序节点展示检索、推理和确定性校验状态</text>
    <text x="680" y="590" font-size="15" fill="#1C2733">· 输出：标准化风险记录、综合置信度和人工复核路由</text>
  </g>
  <g id="page-footer" data-pptx-role="footer" data-pptx-bounds="56 648 1168 30">
