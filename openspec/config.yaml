schema: riskflow-delivery

context: |
  RiskFlow 当前以中文交付，生产栈为 Node.js 24、pnpm、TypeScript；生产 workspace 仅包含 apps/web、apps/api、apps/worker 与 packages/contracts、packages/core、packages/adapters。
  四层边界固定为数据接入层、知识建模层、智能推理层、应用输出层，跨层通过显式接口契约沟通。
  识别与评估分别沿 RI-S1–RI-S6、RA-S1–RA-S7 追踪；共享 Schema 是唯一事实源，版本、证据定位与审计信息贯穿可重放链路。
  Agent-native 任务仅处理受限语义工作；Schema 校验、P/C 计算、风险矩阵、阈值判断、持久化与版本发布由确定性领域逻辑负责。测试验证稳定可观察行为，不锁定提示词或内部实现。
  配置只描述当前有效约束，不复制完整专利正文、变更历史或 39-change 路线。

rules:
  proposal:
    - 明确范围、依赖、所有权、RI/RA 追踪和依赖治理。
  specs:
    - 场景描述可观察行为及适用的失败、权限、版本和幂等边界。
  design:
    - 使用稳定 D-ID 固定接口、Schema、状态、持久化、权限、错误、事务、可观测性、迁移、文件所有权与 RI/RA 追踪。
  implementation-plan:
    - 基于固定 base commit，将每个 Requirement/Scenario、计划文件、现有符号、实现动作与可运行验证映射到稳定 IP-ID；不存在需要实现 Agent 自行决定的公共契约、数据规则、事务语义或测试范围。
  tasks:
    - 每项引用 implementation-plan 中的 IP-ID，写明可运行验证命令；tasks 只跟踪顺序与完成状态，不复制代码施工图。

operations:
  apply:
    guidance:
      - 仅使用已归档 change 的直接依赖，并执行最小必要验证。
      - 实现导致的普通测试失败在当前实现任务内修复；只有公共契约、权限、事务、持久化、迁移、依赖、范围或规划漂移需要升级。
      - 进入 Finalizing 后由 Finalizer 在已批准语义内核验、修复并回归；普通缺陷不得退回首轮实现角色。
  archive:
    guidance:
      - 归档前必须由 Finalizer 对最终 HEAD 完成 verify 与收尾，必要的限定审计通过，同步主 specs，并确认无活动下游引用未归档契约。
