<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <filter id="screen-shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#163B63" flood-opacity="0.10"/></filter>
  </defs>
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="page-header" data-pptx-role="header" data-pptx-bounds="56 26 1168 50" font-family="Microsoft YaHei, Arial, sans-serif">
    <text x="56" y="47" font-size="13" font-weight="700" fill="#2F8F7A">02 项目研发进展</text>
    <text x="1224" y="47" text-anchor="end" font-size="11" fill="#4A5568">02.04 各子课题工作进展 · 子课题一（站隧一体化建造风险智能识别与评估技术）</text>
    <line x1="56" y1="70" x2="1224" y2="70" stroke="#D5DCE4" stroke-width="1"/>
  </g>
  <g id="title" data-pptx-bounds="56 82 1168 44"><text x="56" y="114" font-size="25" font-weight="700" fill="#163B63">系统演示（二）智能 Agent 与智能识别（演示原型）</text></g>
  <g id="agent-screen" data-pptx-bounds="56 146 568 320">
    <rect x="56" y="146" width="568" height="320" rx="10" fill="#FFFFFF" filter="url(#screen-shadow)"/>
    <image href="../images/image14.png" x="56" y="146" width="568" height="320" preserveAspectRatio="xMidYMid meet"/>
    <rect x="56" y="146" width="568" height="320" rx="10" fill="none" stroke="#D5DCE4" stroke-width="1"/>
  </g>
  <g id="recognition-screen" data-pptx-bounds="656 146 568 320">
    <rect x="656" y="146" width="568" height="320" rx="10" fill="#FFFFFF" filter="url(#screen-shadow)"/>
    <image href="../images/image15.png" x="656" y="146" width="568" height="320" preserveAspectRatio="xMidYMid meet"/>
    <rect x="656" y="146" width="568" height="320" rx="10" fill="none" stroke="#D5DCE4" stroke-width="1"/>
  </g>
  <g id="agent-summary" data-pptx-bounds="56 492 568 130">
    <rect x="56" y="492" width="568" height="130" rx="10" fill="#FFF7EC"/>
    <text x="80" y="522" font-size="17" font-weight="700" fill="#F2994A">智能 Agent 工作台</text>
    <text x="80" y="556" font-size="15" fill="#1C2733">· 输入：工程问题、关联项目和资料版本</text>
    <text x="80" y="590" font-size="15" fill="#1C2733">· 输出：评估结论、P/C 分值、触发指标及证据引用</text>
  </g>
