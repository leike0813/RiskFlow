    <image href="../images/image17.png" x="656" y="146" width="568" height="320" preserveAspectRatio="xMidYMid meet"/>
    <rect x="656" y="146" width="568" height="320" rx="10" fill="none" stroke="#D5DCE4" stroke-width="1"/>
  </g>
  <g id="assessment-summary" data-pptx-bounds="56 492 568 130">
