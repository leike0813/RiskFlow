    <text x="674" y="530" font-size="15" font-weight="700" fill="#163B63">执行资源预算</text><text x="674" y="558" font-size="14" fill="#1C2733">模型、工具、并发和墙钟<tspan x="674" dy="22">时间设硬预算</tspan></text>
