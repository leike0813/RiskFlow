    <text x="237" y="181" text-anchor="middle" font-size="17" font-weight="700" fill="#F2994A">同类型案例不足</text>
    <text x="237" y="222" text-anchor="middle" font-size="15" fill="#1C2733">新装备、新工法难以直接套用历史风险清单</text>
