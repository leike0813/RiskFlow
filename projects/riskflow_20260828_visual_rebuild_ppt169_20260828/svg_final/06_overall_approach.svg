    <text x="627" y="181" text-anchor="middle" font-size="17" font-weight="700" fill="#163B63">规则适用条件复杂</text>
    <text x="627" y="222" text-anchor="middle" font-size="15" fill="#1C2733">工法、地层和工程阶段变化会影响规则选用</text>
    <rect x="836" y="148" width="388" height="106" rx="10" fill="#F4F7FA" />
    <text x="1030" y="181" text-anchor="middle" font-size="17" font-weight="700" fill="#163B63">人工排查难追溯</text>
