    <text text-anchor="middle" fill="#1C2733" font-size="15" x="627" y="538">按适用规则计算 P/C 分值，</text><text text-anchor="middle" fill="#1C2733" font-size="15" x="627" y="563">再映射版本化风险矩阵</text><rect x="836" y="460" width="388" height="150" rx="10" fill="#FFF7EC" />
