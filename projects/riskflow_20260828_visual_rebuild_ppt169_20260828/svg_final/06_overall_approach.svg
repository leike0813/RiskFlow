    <line x1="636" y1="356" x2="814" y2="356" stroke="#2F8F7A" stroke-width="3" marker-end="url(#arrow-teal)" />
    <line x1="866" y1="356" x2="1044" y2="356" stroke="#F2994A" stroke-width="3" marker-end="url(#arrow-orange)" />
