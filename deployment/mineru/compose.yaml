name: riskflow-mineru

x-environment: &environment
  MINERU_HOME: /var/lib/mineru
  MINERU_CONFIG: /etc/mineru/config.yaml
  MINERU_MODEL_SOURCE: local
  MINERU_MODEL_SMALL_BACKEND: onnx
  MINERU_MODEL_VLM_ENGINE: llama-cpp
  MINERU_TABLE_DEVICE: cpu
  MINERU_INTRA_OP_NUM_THREADS: "4"
  MINERU_INTER_OP_NUM_THREADS: "1"
  OMP_NUM_THREADS: "16"

x-service: &service
  platform: linux/amd64
  image: riskflow/mineru:4.0.12-llama0.1.3-onnx
  build:
    context: .
  restart: unless-stopped
  init: true
  cpus: 16
  cpuset: "${MINERU_CPUSET:-0-15}"
  mem_limit: 24g
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=5).read()"
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 180s
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "3"

services:
  gpu:
    <<: *service
    ports:
      - "127.0.0.1:18000:8000"
    environment:
      <<: *environment
      MINERU_LLAMA_CPP_BACKEND: vulkan
      NVIDIA_DRIVER_CAPABILITIES: graphics,compute,utility
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/nvidia_icd.json
    volumes:
      - ./config.yaml:/etc/mineru/config.yaml:ro
      - "${MINERU_DATA_DIR:-/home/joshua/.local/share/riskflow-mineru}/models:/models:ro"
      - "${MINERU_DATA_DIR:-/home/joshua/.local/share/riskflow-mineru}/models/.locks:/models/.locks"
      - "${MINERU_DATA_DIR:-/home/joshua/.local/share/riskflow-mineru}/gpu:/var/lib/mineru"
      - /usr/share/vulkan/icd.d/nvidia_icd.json:/usr/share/vulkan/icd.d/nvidia_icd.json:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${MINERU_GPU_DEVICE:-0}"]
              capabilities: [gpu]

  cpu:
    <<: *service
    profiles: [cpu]
    ports:
      - "127.0.0.1:18001:8000"
    environment:
      <<: *environment
      MINERU_LLAMA_CPP_BACKEND: cpu
    volumes:
      - ./config.yaml:/etc/mineru/config.yaml:ro
      - "${MINERU_DATA_DIR:-/home/joshua/.local/share/riskflow-mineru}/models:/models:ro"
      - "${MINERU_DATA_DIR:-/home/joshua/.local/share/riskflow-mineru}/models/.locks:/models/.locks"
      - "${MINERU_DATA_DIR:-/home/joshua/.local/share/riskflow-mineru}/cpu:/var/lib/mineru"

  prepare:
    image: riskflow/mineru:4.0.12-llama0.1.3-onnx
    build:
      context: .
    profiles: [prepare]
    restart: "no"
    environment:
      <<: *environment
      MINERU_LLAMA_CPP_BACKEND: cpu
    volumes:
      - ./config.yaml:/etc/mineru/config.yaml:ro
      - "${MINERU_DATA_DIR:-/home/joshua/.local/share/riskflow-mineru}/models:/models"
      - "${MINERU_DATA_DIR:-/home/joshua/.local/share/riskflow-mineru}/prepare:/var/lib/mineru"
    command:
      [
        models,
        download,
        --tier,
        standard,
        --small-backend,
        onnx,
        --vlm-engine,
        llama-cpp,
        --source,
        huggingface,
      ]
