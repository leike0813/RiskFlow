    <circle cx="1062" cy="356" r="34" fill="#F2994A" /><text x="1062" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">处置反馈</text>
    <path d="M1062 397 V420 H142 V397" fill="none" stroke="#F2994A" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow-orange)" />
    <text x="602" y="418" text-anchor="middle" font-size="14" fill="#F2994A">反馈复核：形成知识更新或校准建议，审核后发布新版本</text>
