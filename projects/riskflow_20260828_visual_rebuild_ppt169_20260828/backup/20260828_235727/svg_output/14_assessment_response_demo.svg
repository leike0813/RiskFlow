    <rect x="656" y="492" width="568" height="130" rx="10" fill="#EEF7F4"/>
    <text x="680" y="522" font-size="17" font-weight="700" fill="#2F8F7A">处置与证据追溯</text>
    <text x="680" y="556" font-size="15" fill="#1C2733">· 处置：候选措施组合经过三项约束校验后提交采纳</text>
