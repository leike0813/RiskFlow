    <text x="80" y="522" font-size="17" font-weight="700" fill="#F2994A">风险评估与预警</text>
    <text x="80" y="556" font-size="15" fill="#1C2733">· 计算：指标实际取值形成 P/C 分值，映射当前风险矩阵版本</text>
    <text x="80" y="590" font-size="15" fill="#1C2733">· 预警：记录触发类型、触发指标、证据和通知状态</text>
