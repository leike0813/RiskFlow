    <text x="972" y="530" font-size="15" font-weight="700" fill="#163B63">保留审计证据</text><text x="972" y="558" font-size="14" fill="#1C2733">记录输入、工具行动、校验和<tspan x="972" dy="22">正式结果，不展示思维链</tspan></text>
