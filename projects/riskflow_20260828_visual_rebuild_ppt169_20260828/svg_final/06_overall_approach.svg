    <text text-anchor="middle" fill="#1C2733" font-size="15" x="237" y="538">按工序节点检索机理与证据，</text><text text-anchor="middle" fill="#1C2733" font-size="15" x="237" y="563">形成标准化风险记录</text><rect x="446" y="460" width="362" height="150" rx="10" fill="#EEF7F4" />
